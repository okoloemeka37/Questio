name: Deploy Laravel to cPanel via SSH/SFTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # PHP Setup
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      # Composer Setup
      - name: Install Composer Packages
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      # Node Setup
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # NPM Setup
      - name: Install Packages
        run: npm ci

      # Build Assets
      - name: Build Assets
        run: npm run build

      # Compress and Deploy
      - name: Compress and Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |

          # ============================================================
          # 1. Setup SSH
          # ============================================================

          mkdir -p ~/.ssh

          echo "$SSH_KEY" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -p 22 -H "$SSH_HOST" >> ~/.ssh/known_hosts


          # ============================================================
          # 2. Create deployment archive
          # ============================================================

          echo "Creating deployment archive..."

          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./tests' \
            --exclude='./deploy.tar.gz' \
            -czf /tmp/deploy.tar.gz .


          echo "Deployment archive created."

          ls -lh /tmp/deploy.tar.gz


          # ============================================================
          # 3. Upload archive to cPanel
          # ============================================================

          echo "Uploading deployment archive..."

          scp \
            -o BatchMode=yes \
            -P 22 \
            /tmp/deploy.tar.gz \
            "$SSH_USER@$SSH_HOST:/home/questio1/Question/deploy.tar.gz"


          echo "Archive uploaded successfully."


          # ============================================================
          # 4. Extract deployment on cPanel
          # ============================================================

          echo "Connecting to cPanel and extracting deployment..."

          ssh \
            -o BatchMode=yes \
            -p 22 \
            "$SSH_USER@$SSH_HOST" << 'EOF'

            set -e

            cd /home/questio1/Question

            echo "=========================================="
            echo "Current directory:"
            pwd
            echo "=========================================="

            echo "Checking deployment archive..."

            if [ ! -f deploy.tar.gz ]; then
              echo "ERROR: deploy.tar.gz was not found."
              exit 1
            fi

            ls -lh deploy.tar.gz

            echo "=========================================="
            echo "Extracting Laravel application..."
            echo "=========================================="

            tar -xzf deploy.tar.gz --overwrite

            echo "=========================================="
            echo "Extraction completed."
            echo "=========================================="

            echo "Removing deployment archive..."

            rm -f deploy.tar.gz

            echo "=========================================="
            echo "Checking archive removal..."
            echo "=========================================="

            if [ -f deploy.tar.gz ]; then
              echo "ERROR: deploy.tar.gz still exists."
              exit 1
            fi

            echo "deploy.tar.gz successfully removed."

            echo "=========================================="
            echo "Deployment completed successfully."
            echo "=========================================="

          EOF


          # ============================================================
          # 5. Clean up GitHub Actions runner
          # ============================================================

          echo "Cleaning up local deployment archive..."

          rm -f /tmp/deploy.tar.gz

          echo "Local cleanup completed."
