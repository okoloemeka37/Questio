name: Deploy Laravel to cPanel via SFTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout repository
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. PHP Setup
      # ============================================================

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer


      # ============================================================
      # 3. Install Composer packages
      # ============================================================

      - name: Install Composer Packages
        run: composer install --no-dev --prefer-dist --optimize-autoloader


      # ============================================================
      # 4. Node Setup
      # ============================================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      # ============================================================
      # 5. Install NPM packages
      # ============================================================

      - name: Install Packages
        run: npm ci


      # ============================================================
      # 6. Build frontend assets
      # ============================================================

      - name: Build Assets
        run: npm run build


      # ============================================================
      # 7. Prepare deployment directory
      # ============================================================

      - name: Prepare Deployment Files
        run: |
          echo "Preparing deployment directory..."

          rm -rf /tmp/laravel-deploy

          mkdir -p /tmp/laravel-deploy

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env' \
            --exclude='deploy.tar.gz' \
            --exclude='storage/app/public' \
            --exclude='public/storage' \
            ./ /tmp/laravel-deploy/

          echo "Deployment directory prepared."

          echo "Files to be deployed:"
          du -sh /tmp/laravel-deploy


      # ============================================================
      # 8. Setup SSH
      # ============================================================

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh

          echo "$SSH_KEY" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -p 22 -H "$SSH_HOST" >> ~/.ssh/known_hosts


      # ============================================================
      # 9. Transfer Laravel files directly to cPanel
      # ============================================================

      - name: Transfer Files to cPanel
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Starting file transfer..."

          scp \
            -r \
            -o BatchMode=yes \
            -P 22 \
            /tmp/laravel-deploy/. \
            "$SSH_USER@$SSH_HOST:/home/questio1/Question/"

          echo "File transfer completed successfully."


      # ============================================================
      # 10. Cleanup
      # ============================================================

      - name: Cleanup
        run: |
          rm -rf /tmp/laravel-deploy

          echo "Cleanup completed."
          echo "Deployment finished successfully."
