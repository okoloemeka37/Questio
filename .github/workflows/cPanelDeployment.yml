name: Deploy Laravel to cPanel via SSH/SFTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # PHP Setup
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      # Composer Setup
      - name: Install Composer Packages
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      # Node Setup
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # NPM Setup
      - name: Install Packages
        run: npm ci

      # Build Assets
      - name: Build Assets
        run: npm run build

      # Sync files using SSH/rsync Action
      - name: Deploy via Native SSH/SCP
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # Set up SSH Key
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Add host to known_hosts to prevent interactive prompts
          ssh-keyscan -p 22 -H "$SSH_HOST" >> ~/.ssh/known_hosts

          # Sync files using scp (-r for recursive, -P for port)
          scp -P 22 -r ./ $SSH_USER@$SSH_HOST:/home/questio1/Question