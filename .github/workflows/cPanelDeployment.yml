name: Deploy Laravel to cPanel via SSH/SFTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # PHP Setup
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      # Composer Setup
      - name: Install Composer Packages
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      # Node Setup
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # NPM Setup
      - name: Install Packages
        run: npm ci

      # Build Assets
      - name: Build Assets
        run: npm run build

      - name: Compress and Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # 1. Setup SSH Key
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 -H "$SSH_HOST" >> ~/.ssh/known_hosts

          # 2. Archive files into /tmp/ to avoid tar modifying the source directory
          tar --exclude='./.git' \
              --exclude='./.github' \
              --exclude='./node_modules' \
              --exclude='./tests' \
              -czf /tmp/deploy.tar.gz .

          # 3. Upload single compressed archive
          scp -o BatchMode=yes -P 22 /tmp/deploy.tar.gz $SSH_USER@$SSH_HOST:/home/questio1/Question/

          # 4. Unpack on cPanel server and delete remote archive
          ssh -o BatchMode=yes -p 22 $SSH_USER@$SSH_HOST "cd /home/questio1/Question && tar -xzf deploy.tar.gz && rm deploy.tar.gz"

          # 5. Clean up local runner archive
          rm /tmp/deploy.tar.gz
