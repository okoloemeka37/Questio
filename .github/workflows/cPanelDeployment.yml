name: Deploy Laravel to cPanel via SSH/SFTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # PHP Setup
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      # Composer Setup
      - name: Install Composer Packages
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      # Node Setup
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # NPM Setup
      - name: Install Packages
        run: npm ci

      # Build Assets
      - name: Build Assets
        run: npm run build

      # Sync files using SSH/rsync Action
      - name: Deploy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22  # Update if cPanel uses port 21098
          source: "./"
          target: "/home/questio1/Question"
          rm: false # Set to true if you want to clean the target dir first